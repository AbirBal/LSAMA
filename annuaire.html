<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annuaire | LSAMA</title>
  <link rel="icon" href="images/logoLSAMA.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <style>
/* ===== VARIABLES (identiques à index.html) ===== */
    :root {
      --navy: #0a1628;
      --navy-mid: #122244;
      --blue: #1a4fa0;
      --blue-light: #2c6dd4;
      --teal: #0e9a8a;
      --teal-light: #14c4b0;
      --gold: #c9961a;
      --gold-light: #f0c040;
      --white: #ffffff;
      --off-white: #f4f6fa;
      --text: #1c2b3a;
      --text-light: #4a5d72;
      --border: #dde3ef;
      --shadow: 0 4px 24px rgba(10,22,40,0.10);
      --shadow-lg: 0 12px 40px rgba(10,22,40,0.16);
      --radius: 12px;
      --radius-lg: 20px;
      --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 16px;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }/* ===== PAGE HERO BANNER ===== */
    .page-hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, var(--blue) 100%);
      padding: 60px 40px;
      position: relative;
      overflow: hidden;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 50%, rgba(14,154,138,0.18) 0%, transparent 60%);
    }
    .page-hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .breadcrumb {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .breadcrumb a { color: rgba(255,255,255,0.7); transition: color var(--transition); }
    .breadcrumb a:hover { color: var(--teal-light); }
    .breadcrumb i { font-size: 10px; }
    .page-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: white;
      margin-bottom: 12px;
    }
    .page-hero p {
      color: rgba(255,255,255,0.75);
      font-size: 15px;
      max-width: 520px;
    }
    .page-hero-icon {
      position: absolute;
      right: 60px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 7rem;
      color: rgba(255,255,255,0.04);
      pointer-events: none;
    }/* ===== MAIN CONTENT ===== */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    /* ===== TOOLBAR (search + sort) ===== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 400px;
    }
    .search-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 14px;
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 11px 16px 11px 40px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--off-white);
      transition: all var(--transition);
      outline: none;
    }
    #searchInput:focus {
      border-color: var(--blue);
      background: white;
      box-shadow: 0 0 0 3px rgba(26,79,160,0.09);
    }
    .sort-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sort-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: white;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      transition: all var(--transition);
    }
    .sort-btn:hover { border-color: var(--blue); color: var(--blue); background: rgba(26,79,160,0.05); }
    .sort-btn.active { border-color: var(--blue); color: var(--blue); background: rgba(26,79,160,0.08); }
    .sort-btn i { font-size: 11px; }

    /* ===== COUNT ===== */
    .results-count {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 24px;
    }
    .results-count strong { color: var(--navy); }

    /* ===== CARDS GRID ===== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .member-card {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      transition: all var(--transition);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .member-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(26,79,160,0.2);
    }
    .member-card-top {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 28px 24px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .member-card-top::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(14,154,138,0.25) 0%, transparent 65%);
    }
    .member-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--teal-light);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }
    .member-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: white;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }
    .member-card-body {
      padding: 20px 24px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .member-info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-light);
    }
    .member-info-row i {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(14,154,138,0.08);
      color: var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .member-info-row a {
      color: var(--blue);
      font-weight: 600;
      transition: color var(--transition);
    }
    .member-info-row a:hover { color: var(--teal); }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-light);
      grid-column: 1 / -1;
    }
    .empty-state i { font-size: 3rem; color: var(--border); margin-bottom: 16px; display: block; }
    .empty-state p { font-size: 15px; }
  </style>
  <link rel="stylesheet" href="style.css">
  <script src="js/navbar.js" defer></script>
</head>

<body>

  <div id="navbar-placeholder"></div>

  <!-- ===== PAGE HERO ===== -->
  <div class="page-hero">
    <i class="fas fa-address-book page-hero-icon"></i>
    <div class="page-hero-inner">
      <nav class="breadcrumb" aria-label="Fil d'Ariane">
        <a href="index.html">Accueil</a>
        <i class="fas fa-chevron-right"></i>
        <span>Annuaire</span>
      </nav>
      <div class="section-badge">Membres du laboratoire</div>
      <h1>Annuaire</h1>
      <p>Retrouvez les coordonnées de tous les membres du Laboratoire LSAMA.</p>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <main>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Rechercher un membre…" oninput="filterCards()" />
      </div>
      <div class="sort-btns">
        <button class="sort-btn active" id="sortNameBtn" onclick="sortCards('name')">
          <i class="fas fa-sort-alpha-down"></i> Nom
        </button>
        <button class="sort-btn" id="sortPhoneBtn" onclick="sortCards('phone')">
          <i class="fas fa-phone"></i> Téléphone
        </button>
      </div>
    </div>

    <p class="results-count" id="resultsCount"></p>

    <!-- Cards grid -->
    <div class="cards-grid" id="cardsGrid"></div>

  </main>

  <div id="footer-placeholder"></div>

  <button id="backToTop" aria-label="Retour en haut" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <i class="fas fa-chevron-up"></i>
  </button>

  <script>
    // ===== DATA =====
    const members = [
      { name: "Mourad Telmini",    phone: "98417878" },
      { name: "Fehmi Khadri",      phone: "20557752" },
      { name: "Soumaya Bezzaouia", phone: "98651102" },
      { name: "Rym Bochendira",    phone: "98434616" },
      { name: "Souad Lahmar",      phone: "29251660" },
      { name: "Ounais Yazidi",     phone: "28141130" },
      { name: "Kamel Hammami",     phone: "98612221" },
    ];

    let currentSort = 'name';
    let sortDir = { name: 'asc', phone: 'asc' };

    function getInitials(name) {
      return name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
    }

    function formatPhone(phone) {
      // Format tunisien : XX XXX XXX
      return phone.replace(/(\d{2})(\d{3})(\d{3})/, '$1 $2 $3');
    }

    function renderCards(data) {
      const grid = document.getElementById('cardsGrid');
      const count = document.getElementById('resultsCount');

      if (data.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-user-slash"></i>
            <p>Aucun membre ne correspond à votre recherche.</p>
          </div>`;
        count.innerHTML = '';
        return;
      }

      count.innerHTML = `<strong>${data.length}</strong> membre${data.length > 1 ? 's' : ''} trouvé${data.length > 1 ? 's' : ''}`;

      grid.innerHTML = data.map(m => `
        <div class="member-card">
          <div class="member-card-top">
            <div class="member-avatar">${getInitials(m.name)}</div>
            <div class="member-name">${m.name}</div>
          </div>
          <div class="member-card-body">
            <div class="member-info-row">
              <i class="fas fa-phone"></i>
              <a href="tel:+216${m.phone}">${formatPhone(m.phone)}</a>
            </div>
            <div class="member-info-row">
              <i class="fas fa-university"></i>
              <span>LSAMA — FST Tunis</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = members.filter(m =>
        m.name.toLowerCase().includes(query) ||
        m.phone.includes(query)
      );
      const sorted = sortData(filtered, currentSort, sortDir[currentSort]);
      renderCards(sorted);
    }

    function sortData(data, key, dir) {
      return [...data].sort((a, b) => {
        const va = key === 'name' ? a.name.toLowerCase() : a.phone;
        const vb = key === 'name' ? b.name.toLowerCase() : b.phone;
        if (va < vb) return dir === 'asc' ? -1 : 1;
        if (va > vb) return dir === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function sortCards(key) {
      // Toggle direction if same key
      if (currentSort === key) {
        sortDir[key] = sortDir[key] === 'asc' ? 'desc' : 'asc';
      }
      currentSort = key;

      // Update button states
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('sort' + (key === 'name' ? 'Name' : 'Phone') + 'Btn').classList.add('active');

      // Update icon direction
      const btn = document.getElementById('sort' + (key === 'name' ? 'Name' : 'Phone') + 'Btn');
      const icon = btn.querySelector('i');
      if (key === 'name') {
        icon.className = sortDir[key] === 'asc' ? 'fas fa-sort-alpha-down' : 'fas fa-sort-alpha-up';
      }

      filterCards();
    }

    // ===== BACK TO TOP =====
    const backBtn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      backBtn.classList.toggle('visible', window.scrollY > 300);
    });

    // ===== INIT =====
    renderCards(sortData(members, 'name', 'asc'));
  </script>
  <script>
    // ===== LOAD SHARED COMPONENTS =====
    async function loadComponent(id, file) {
      try {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
        if (id === 'navbar-placeholder') {
          // Mark active nav link based on current page filename
          const page = window.location.pathname.split('/').pop() || 'index.html';
          document.querySelectorAll('#navbar-placeholder .nav-links a[data-page]').forEach(a => {
            a.classList.remove('active');
            if (a.getAttribute('data-page') === page) a.classList.add('active');
          });
        }
      } catch(e) { console.warn('Could not load', file, e); }
    }
    loadComponent('navbar-placeholder', 'navbar.html');
    loadComponent('footer-placeholder', 'footer.html');
  </script>
</body>
</html>
