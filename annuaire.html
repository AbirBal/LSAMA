<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annuaire | LSAMA</title>
  <link rel="icon" href="images/logoLSAMA.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/annuaire.css">
  <script src="js/navbar.js" defer></script>
</head>

<body>

  <div id="navbar-placeholder"></div>

  <!-- ===== PAGE HERO ===== -->
  <div class="page-hero">
    <i class="fas fa-address-book page-hero-icon"></i>
    <div class="page-hero-inner">
      <nav class="breadcrumb" aria-label="Fil d'Ariane">
        <a href="index.html">Accueil</a>
        <i class="fas fa-chevron-right"></i>
        <span>Annuaire</span>
      </nav>
      <div class="section-badge">Membres du laboratoire</div>
      <h1>Annuaire</h1>
      <p>Retrouvez les coordonnées de tous les membres du Laboratoire LSAMA.</p>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <main>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Rechercher un membre…" oninput="filterCards()" />
      </div>
      <div class="sort-btns">
        <button class="sort-btn active" id="sortNameBtn" onclick="sortCards('name')">
          <i class="fas fa-sort-alpha-down"></i> Nom
        </button>
        <button class="sort-btn" id="sortPhoneBtn" onclick="sortCards('phone')">
          <i class="fas fa-phone"></i> Téléphone
        </button>
      </div>
    </div>

    <p class="results-count" id="resultsCount"></p>

    <!-- Cards grid -->
    <div class="cards-grid" id="cardsGrid"></div>

  </main>

  <div id="footer-placeholder"></div>

  <button id="backToTop" aria-label="Retour en haut" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <i class="fas fa-chevron-up"></i>
  </button>

  <script>
    // ===== DATA =====
    const members = [
      { name: "Mourad Telmini",    phone: "98417878" },
      { name: "Fehmi Khadri",      phone: "20557752" },
      { name: "Soumaya Bezzaouia", phone: "98651102" },
      { name: "Rym Bochendira",    phone: "98434616" },
      { name: "Souad Lahmar",      phone: "29251660" },
      { name: "Ounais Yazidi",     phone: "28141130" },
      { name: "Kamel Hammami",     phone: "98612221" },
    ];

    let currentSort = 'name';
    let sortDir = { name: 'asc', phone: 'asc' };

    function getInitials(name) {
      return name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
    }

    function formatPhone(phone) {
      // Format tunisien : XX XXX XXX
      return phone.replace(/(\d{2})(\d{3})(\d{3})/, '$1 $2 $3');
    }

    function renderCards(data) {
      const grid = document.getElementById('cardsGrid');
      const count = document.getElementById('resultsCount');

      if (data.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-user-slash"></i>
            <p>Aucun membre ne correspond à votre recherche.</p>
          </div>`;
        count.innerHTML = '';
        return;
      }

      count.innerHTML = `<strong>${data.length}</strong> membre${data.length > 1 ? 's' : ''} trouvé${data.length > 1 ? 's' : ''}`;

      grid.innerHTML = data.map(m => `
        <div class="member-card">
          <div class="member-card-top">
            <div class="member-avatar">${getInitials(m.name)}</div>
            <div class="member-name">${m.name}</div>
          </div>
          <div class="member-card-body">
            <div class="member-info-row">
              <i class="fas fa-phone"></i>
              <a href="tel:+216${m.phone}">${formatPhone(m.phone)}</a>
            </div>
            <div class="member-info-row">
              <i class="fas fa-university"></i>
              <span>LSAMA — FST Tunis</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = members.filter(m =>
        m.name.toLowerCase().includes(query) ||
        m.phone.includes(query)
      );
      const sorted = sortData(filtered, currentSort, sortDir[currentSort]);
      renderCards(sorted);
    }

    function sortData(data, key, dir) {
      return [...data].sort((a, b) => {
        const va = key === 'name' ? a.name.toLowerCase() : a.phone;
        const vb = key === 'name' ? b.name.toLowerCase() : b.phone;
        if (va < vb) return dir === 'asc' ? -1 : 1;
        if (va > vb) return dir === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function sortCards(key) {
      // Toggle direction if same key
      if (currentSort === key) {
        sortDir[key] = sortDir[key] === 'asc' ? 'desc' : 'asc';
      }
      currentSort = key;

      // Update button states
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('sort' + (key === 'name' ? 'Name' : 'Phone') + 'Btn').classList.add('active');

      // Update icon direction
      const btn = document.getElementById('sort' + (key === 'name' ? 'Name' : 'Phone') + 'Btn');
      const icon = btn.querySelector('i');
      if (key === 'name') {
        icon.className = sortDir[key] === 'asc' ? 'fas fa-sort-alpha-down' : 'fas fa-sort-alpha-up';
      }

      filterCards();
    }

    // ===== BACK TO TOP =====
    const backBtn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      backBtn.classList.toggle('visible', window.scrollY > 300);
    });

    // ===== INIT =====
    renderCards(sortData(members, 'name', 'asc'));
  </script>
  <script>
    // ===== LOAD SHARED COMPONENTS =====
    async function loadComponent(id, file) {
      try {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
        if (id === 'navbar-placeholder') {
          // Mark active nav link based on current page filename
          const page = window.location.pathname.split('/').pop() || 'index.html';
          document.querySelectorAll('#navbar-placeholder .nav-links a[data-page]').forEach(a => {
            a.classList.remove('active');
            if (a.getAttribute('data-page') === page) a.classList.add('active');
          });
        }
      } catch(e) { console.warn('Could not load', file, e); }
    }
    loadComponent('navbar-placeholder', 'navbar.html');
    loadComponent('footer-placeholder', 'footer.html');
  </script>
</body>
</html>
